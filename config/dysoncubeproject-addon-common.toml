[oreProcessing]
	#Enable the integrated grinding, washing and thermal processing chain.
	enabled = true
	#Total FE charged per input ore. The three UI stages are visual only.
	# Default: 12000
	# Range: 0 ~ 9223372036854775807
	Cost = 12000

[integration]
	#Enable AE2 network integration when an AE2 network is present.
	aeNetworkEnabled = true
	#Enable sampled server performance logs tagged [VMP] when VMP is installed.
	vmpPerformanceLogging = false
