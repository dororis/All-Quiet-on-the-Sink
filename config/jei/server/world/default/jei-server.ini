# 名称：Server Cheat Permissions
# 描述：Choose who can use JEI cheat mode on this server.
[permissions]
	# 名称：Allow Cheat Mode for Operators
	# 描述：Allow players with operator status (/op) to use JEI cheat mode.
	# 有效值：[true, false]
	# 默认值：true
	enableCheatModeForOp = true

	# 名称：Allow Cheat Mode in Creative Mode
	# 描述：Allow players in Creative Mode to use JEI cheat mode.
	# 有效值：[true, false]
	# 默认值：true
	enableCheatModeForCreative = true

	# 名称：Allow Cheat Mode with Give Permission
	# 描述：Allow players who can use the /give command to use JEI cheat mode.
	# 有效值：[true, false]
	# 默认值：false
	enableCheatModeForGive = false


