# Whether search for recipes asynchronously.
# Keep this disabled: some MB2/LDLib machine paths access Minecraft/NeoForge state
# and are not safe from an async worker thread.
asyncRecipeSearching = false
# Whether use vbo for preview page rendering.
useVBO = true
# Duration of the multiblock in-world preview (s)
# Default: 10
# Range: 1 ~ 999
multiblockPreviewDuration = 10
# Duration of the multiblock in-world pattern error position (s)
# Default: 10
# Range: 1 ~ 999
multiblockPatternErrorPosDuration = 5